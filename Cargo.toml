[package]
name = "token_scanner_eth"
version = "0.1.0"
edition = "2024"
authors = ["Oduwale Awwal <harwarl87@gmail.com>"]
description = "An Ethereum token scanner built in Rust"
license = "MIT"
repository = "https://github.com/Harwarl/token_scanner_eth"
keywords = ["ethereum", "web3", "token", "scanner", "blockchain"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[dependencies]
tracing = "0.1"
serde_json = "1.0.150"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = {version = "1.52.3", features = ["full"]}
alloy = { version = "2.0.5", features = ["full", "pubsub"] }
serde = { version = "1.0.228", features = ["derive"] }
dotenv = "0.15.0"
thiserror = "2.0.18"
url = "2.5.8"
futures-util = "0.3.32"
reqwest = { version= "0.13.4", features = ["json"] }
wiremock = "0.6.5"
hex = "0.4.3"
teloxide = "0.17.0"
axum = "0.8.9"
eyre = "0.6.12"
