name: TOKEN_SCANNER

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
      
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
      
